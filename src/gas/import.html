<!DOCTYPE html>
<html>
  <head>
    <base target="_top" />
    <style>
      body { font: 14px/1.4 system-ui, sans-serif; margin: 16px; color: #202124; }
      p { margin: 0 0 12px; color: #5f6368; }
      #log div { margin: 8px 0; }
      .err { color: #c5221f; }

    <!-- pdf.js, pinned and integrity-checked. It runs here in your browser; the PDF is never uploaded. -->

  </head>
  <body>
    <p>Pick OCBC or DBS/POSB statement PDFs. They're read in your browser and only the transactions are saved to this sheet. Importing the same statement twice adds nothing.</p>
    <input type="file" id="files" accept="application/pdf" multiple />
    <div id="log"></div>
    <script>/*CLIENT*/</script>
  </body>
</html>
